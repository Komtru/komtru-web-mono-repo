# Local development infrastructure. Start with `pnpm infra:up` (waits for every health check).
# Ports default to non-standard values so they never clash with an existing local Postgres or Redis;
# override with the KOMTRU_* variables (scripts/env/local-infra.mjs reads the same ones).
# Credentials here are for throwaway local containers only.
name: komtru

services:
  postgres:
    image: postgres:16-alpine
    # One database per vitest worker, each with its own PgBouncer pool, so a parallel infra run
    # needs more headroom than the default 100 backends (T-029).
    command: ['postgres', '-c', 'max_connections=300']
    environment:
      POSTGRES_USER: komtru
      POSTGRES_PASSWORD: komtru
      POSTGRES_DB: komtru_v2_dev
    ports:
      - '${KOMTRU_PG_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U komtru -d komtru_v2_dev']
      interval: 2s
      timeout: 3s
      retries: 30

  # Transaction pooling from day one (design §4.4). The app connects here; migrations bypass it.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: komtru
      DB_PASSWORD: komtru
      # No DB_NAME: the generated [databases] entry is `*`, so per-worker test databases route through
      # PgBouncer too. Users other than komtru (e.g. the komtru_app runtime role) are looked up in
      # Postgres through the generated `auth_user=komtru`.
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '200'
      # Sized so every parallel test database can fill its pool without overcommitting Postgres:
      # the suite ran 12 databases at a pool of 20, asking for up to 240 backends against 100.
      DEFAULT_POOL_SIZE: '10'
      MAX_DB_CONNECTIONS: '15'
      # 0, not the default 15s. PgBouncer otherwise caches a failed server login and serves that
      # error to every client for the retry window, so one exhaustion event surfaces as "password
      # authentication failed for user komtru" across unrelated test files — a message that reads
      # as a credentials fault and is not one (T-029).
      SERVER_LOGIN_RETRY: '0'
      ADMIN_USERS: komtru
      LISTEN_PORT: '5432'
    ports:
      - '${KOMTRU_PGBOUNCER_PORT:-56432}:5432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 here and PgBouncer listens on IPv4.
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 5432']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${KOMTRU_REDIS_PORT:-56379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the backend sends locally; UI at http://localhost:58025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${KOMTRU_MAILPIT_SMTP_PORT:-51025}:1025'
      - '${KOMTRU_MAILPIT_UI_PORT:-58025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
