# CI for apps/backend-api. Path-filtered to the app, the packages it depends on and the few root
# files that change every build, so a change to another app never starts this run. GitHub Actions
# does not support YAML anchors, hence the duplicated `paths:` list.
name: backend-api

on:
  push:
    # Two release branches, two hosts: `main` is production (api.komtru.com) and `staging` is
    # staging (staging-api.komtru.com). The deploy job below picks the host from the branch.
    branches: [main, staging]
    paths:
      - 'apps/backend-api/**'
      - 'packages/config/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      # The migration-safety job is this workflow's, so a change to the tool, to a waiver or to the
      # recorded invariants has to re-run it.
      - 'tools/migration-safety/**'
      - '.github/workflows/backend-api.yml'
      - '.github/actions/setup/**'
  pull_request:
    paths:
      - 'apps/backend-api/**'
      - 'packages/config/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      # The migration-safety job is this workflow's, so a change to the tool, to a waiver or to the
      # recorded invariants has to re-run it.
      - 'tools/migration-safety/**'
      - '.github/workflows/backend-api.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-api-${{ github.ref }}
  # Superseding a feature branch's run is fine; cancelling main's would kill a deploy half-way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: backend-api
      - name: Fee schedule version
        # A fee value may not change without a `version` bump (design §6.5). `config/**` is outside
        # every app workflow's derived path filter, so this also runs in the unfiltered repo
        # workflow - otherwise a commit touching only config/fees.yaml would be checked by nothing.
        run: |
          # On a push, origin/main IS the commit just pushed, so comparing against it would compare
          # the file with itself and pass every time. The base is what main pointed at before.
          if [ "${{ github.event_name }}" = "push" ]; then
            base='${{ github.event.before }}'
            git fetch --no-tags --depth=2 origin "$base" || true
          else
            git fetch --no-tags --depth=1 origin main
            base=FETCH_HEAD
          fi
          node tools/fee-version-check/cli.mjs "$base"
      - run: pnpm exec turbo run lint --filter=@komtru/backend-api

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: backend-api
      - run: pnpm exec turbo run typecheck --filter=@komtru/backend-api

  # Unit and integration tests in one pass: with KOMTRU_INFRA_TESTS=1 the `*.int.test.ts` suites stop
  # skipping themselves and the Vitest globalSetup migrates the template database these services host.
  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    # Three shards. This suite is ~340 files and ten minutes on one runner, and almost all of that
    # is module import rather than assertions - splitting the files across runners is the only
    # thing that helps, because each shard imports only its own third.
    #
    # Safe to cache: turbo folds the arguments after `--` into the task hash, so shard 2 cannot be
    # handed shard 1's cached result. Verified by running two shards back to back and watching
    # both miss with different hashes.
    #
    # Each shard gets its own Postgres, PgBouncer and Redis - service containers are per-job, so
    # the integration tests stay as isolated from each other as they were on one runner.
    #
    # `fail-fast: false` because the first red shard would otherwise cancel the other two and hide
    # however many failures they were about to report.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      KOMTRU_INFRA_TESTS: '1'
      KOMTRU_TEST_DIRECT_URL: postgresql://komtru:komtru@localhost:55432
      KOMTRU_TEST_POOLED_URL: postgresql://komtru_app:komtru_app@localhost:56432
    # Mirrors docker-compose.yml, on the same published ports, because the backend's integration
    # tests still hard-code redis://localhost:56379 and default to those Postgres ports. Throwaway
    # container credentials only; nothing here is a real secret.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: komtru
          POSTGRES_PASSWORD: komtru
          POSTGRES_DB: komtru_v2_dev
        ports:
          - '55432:5432'
        options: >-
          --health-cmd "pg_isready -U komtru -d komtru_v2_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      # Service containers share one network and resolve each other by service id, so DB_HOST is
      # literally `postgres`. No DB_NAME, so the generated [databases] entry is `*` and the
      # per-worker test databases route through PgBouncer too.
      pgbouncer:
        image: edoburu/pgbouncer:latest
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_USER: komtru
          DB_PASSWORD: komtru
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_CLIENT_CONN: '200'
          DEFAULT_POOL_SIZE: '10'
          MAX_DB_CONNECTIONS: '15'
          SERVER_LOGIN_RETRY: '0'
          ADMIN_USERS: komtru
          LISTEN_PORT: '5432'
        ports:
          - '56432:5432'
        options: >-
          --health-cmd "nc -z 127.0.0.1 5432"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7-alpine
        ports:
          - '56379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: backend-api
      - run: pnpm exec turbo run test --filter=@komtru/backend-api -- --shard=${{ matrix.shard }}/3

  # T-022. The backend's own Vitest globalSetup already proves every migration applies to an empty
  # database on every infra run, so this job is the rest: journal and snapshot drift, a migration
  # edited after it was applied, a statement that is only safe on an empty table, the maintained list
  # of partial unique indexes, check constraints and triggers, and the apply forward from main's
  # schema — the one check that sees the database a deploy will actually meet. Beside `test` rather
  # than behind it: it shares nothing with the suite but the two static jobs.
  migration-safety:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    env:
      KOMTRU_TEST_DIRECT_URL: postgresql://komtru:komtru@localhost:55432
    # Migrations run as the owner, straight at Postgres, never through PgBouncer (src/db/migrator.ts),
    # so this job needs neither the pooler nor Redis. Throwaway container credentials only.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: komtru
          POSTGRES_PASSWORD: komtru
          POSTGRES_DB: komtru_v2_dev
        ports:
          - '55432:5432'
        options: >-
          --health-cmd "pg_isready -U komtru -d komtru_v2_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The forward apply reads main's migration folder out of git; a shallow clone has no main.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: backend-api
      - run: pnpm migration:safety

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: backend-api
      - run: pnpm exec turbo run build --filter=@komtru/backend-api

  # T-005 replaces the placeholder with the real API and worker deploys.
  deploy:
    needs: [test, build, migration-safety]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    # Which host this is, decided from the branch. The environment carries the address, the key
    # and the host key, so the two deploys differ by one word here and nothing else — and the
    # repository can require a reviewer on production alone, from Settings -> Environments.
    environment: ${{ github.ref == 'refs/heads/main' && 'backend-production' || 'backend-staging' }}
    # One deploy at a time PER HOST. Grouping both under one name would make a staging push wait
    # on a production deploy that shares nothing with it; grouping neither would let two runs race
    # on the same checkout, the same migration and the same PM2 reload.
    concurrency:
      group: deploy-backend-api-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # No checkout: nothing from the workspace is sent to the host. The instance clones the
      # public repository itself, so this job only needs to name a branch.
      - name: Open an SSH session that can do exactly one thing
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key rather than StrictHostKeyChecking=no: accepting any key would let
          # anything that can answer on that address collect a deploy session.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # The branch name is the argument to the forced command in the host's authorized_keys,
          # not a shell command: sshd runs /srv/komtru/bin/ci-deploy and hands it this string,
          # which ci-deploy matches against an allowlist (main, staging, or a full sha) before
          # using it. A session opened with this key cannot reach a shell.
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              "komtru@${EC2_HOST}" "${REF}"

      # The host this run just deployed, not a hardcoded one: pointed at the wrong host this step
      # would report the OTHER environment's health and pass a broken deploy.
      - name: Confirm the API is serving the new build
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${API_BASE_URL}" || { echo "API_BASE_URL is not set on this environment" >&2; exit 1; }
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 "${API_BASE_URL}/health/ready"; then
              echo; echo "healthy after ${attempt} attempt(s)"; exit 0
            fi
            sleep 10
          done
          echo "${API_BASE_URL} did not report ready after the deploy" >&2
          exit 1
