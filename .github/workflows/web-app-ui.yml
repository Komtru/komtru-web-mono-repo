# CI for apps/web-app-ui. Path-filtered to the app, the packages it depends on and the few root files that
# change every build, so a change to another app never starts this run. GitHub Actions does not
# support YAML anchors, hence the duplicated `paths:` list.
name: web-app-ui

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-app-ui/**'
      - 'packages/api-client/**'
      - 'packages/app-kit/**'
      - 'packages/config/**'
      - 'packages/shared-types/**'
      - 'packages/ui-kit/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/web-app-ui.yml'
      - '.github/actions/setup/**'
  pull_request:
    paths:
      - 'apps/web-app-ui/**'
      - 'packages/api-client/**'
      - 'packages/app-kit/**'
      - 'packages/config/**'
      - 'packages/shared-types/**'
      - 'packages/ui-kit/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/web-app-ui.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-app-ui-${{ github.ref }}
  # Superseding a feature branch's run is fine; cancelling main's would kill a deploy half-way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: web-app-ui
      - run: pnpm exec turbo run lint --filter=@komtru/web-app-ui

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: web-app-ui
      - run: pnpm exec turbo run typecheck --filter=@komtru/web-app-ui

  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: web-app-ui
      - run: pnpm exec turbo run test --filter=@komtru/web-app-ui

  build:
    needs: [test]
    runs-on: ubuntu-latest
    # `next build` inlines every NEXT_PUBLIC_* value into the client bundle and evaluates the route
    # modules to collect page data, so the app's environment has to exist before the build, not at
    # deploy time. The fallbacks keep this job honest on a fork or before the repository variables
    # are set; the artefact is never deployed from here (the deploy step below is still a
    # placeholder, and T-005 is where the real values arrive as repository variables and secrets).
    env:
      NEXT_PUBLIC_KOMTRU_APP_URL: ${{ vars.WEB_APP_URL || 'https://app.komtru.com' }}
      NEXT_PUBLIC_KOMTRU_API_URL: ${{ vars.KOMTRU_API_URL || 'https://api.komtru.com/v1' }}
      NEXT_PUBLIC_KOMTRU_PASSPORT_URL: ${{ vars.KOMTRU_PASSPORT_URL || 'https://passport.komtru.com' }}
      NEXT_PUBLIC_KOMTRU_PARK_URL: ${{ vars.KOMTRU_PARK_URL || 'https://park.komtru.com' }}
      # Server-side only and never baked into a bundle; the build needs one because middleware and
      # the auth route refuse to load without it, which is the behaviour that keeps a deployment
      # from running with no way to tell a real session from a made-up one.
      KOMTRU_SESSION_SECRET: ${{ secrets.KOMTRU_SESSION_SECRET || 'ci-build-only-placeholder-secret' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: web-app-ui
      - run: pnpm exec turbo run build --filter=@komtru/web-app-ui

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Placeholder: the hosting target is design §12 Q1, confirmed and wired up in T-005. Real
      # credentials will arrive as ${{ secrets.* }}; never as literals in this file.
      - run: echo "No deploy target for web-app-ui yet - T-005 confirms the hosting target and replaces this step."
