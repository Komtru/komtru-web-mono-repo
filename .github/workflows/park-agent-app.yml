# CI for apps/park-agent-app. Path-filtered to the app, the packages it depends on and the few root files that
# change every build, so a change to another app never starts this run. GitHub Actions does not
# support YAML anchors, hence the duplicated `paths:` list.
name: park-agent-app

on:
  push:
    # `staging` as well as `main`: every ticket now branches off staging and merges back into it
    # (MASTER_BUILD_PROMPT step 7), so that is where work actually lands. Without this the merge
    # commit itself is never built — a pull request is checked, but the result of merging it is
    # not, and a staging deploy would go out on a commit no workflow ever saw.
    branches: [main, staging]
    paths:
      - 'apps/park-agent-app/**'
      - 'packages/api-client/**'
      - 'packages/app-kit/**'
      - 'packages/config/**'
      - 'packages/shared-types/**'
      - 'packages/ui-kit/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/park-agent-app.yml'
      - '.github/actions/setup/**'
  pull_request:
    paths:
      - 'apps/park-agent-app/**'
      - 'packages/api-client/**'
      - 'packages/app-kit/**'
      - 'packages/config/**'
      - 'packages/shared-types/**'
      - 'packages/ui-kit/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/park-agent-app.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: park-agent-app-${{ github.ref }}
  # Superseding a feature branch's run is fine. Neither release branch may be cancelled:
  # `staging` deploys now too, so cutting its run short kills a deploy half-way exactly as
  # cancelling main's would.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: park-agent-app
      - run: pnpm exec turbo run lint --filter=@komtru/park-agent-app

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: park-agent-app
      - run: pnpm exec turbo run typecheck --filter=@komtru/park-agent-app

  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: park-agent-app
      - run: pnpm exec turbo run test --filter=@komtru/park-agent-app

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: park-agent-app
      - run: pnpm exec turbo run build --filter=@komtru/park-agent-app

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Placeholder: the hosting target is design §12 Q1, confirmed and wired up in T-005. Real
      # credentials will arrive as ${{ secrets.* }}; never as literals in this file.
      - run: echo "No deploy target for park-agent-app yet - it is post-MVP and gets a host with its wave (T-005 hosted the MVP apps)."
