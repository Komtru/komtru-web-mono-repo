# CI for apps/logistics-ops. Path-filtered to the app, the packages it depends on and the few root files that
# change every build, so a change to another app never starts this run. GitHub Actions does not
# support YAML anchors, hence the duplicated `paths:` list.
name: logistics-ops

on:
  push:
    branches: [main]
    paths:
      - 'apps/logistics-ops/**'
      - 'packages/config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/logistics-ops.yml'
      - '.github/actions/setup/**'
  pull_request:
    paths:
      - 'apps/logistics-ops/**'
      - 'packages/config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/logistics-ops.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logistics-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: logistics-ops
      - run: pnpm exec turbo run lint --filter=@komtru/logistics-ops

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: logistics-ops
      - run: pnpm exec turbo run typecheck --filter=@komtru/logistics-ops

  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: logistics-ops
      - run: pnpm exec turbo run test --filter=@komtru/logistics-ops

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: logistics-ops
      - run: pnpm exec turbo run build --filter=@komtru/logistics-ops

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Placeholder: the hosting target is design §12 Q1, confirmed and wired up in T-005. Real
      # credentials will arrive as ${{ secrets.* }}; never as literals in this file.
      - run: echo "No deploy target for logistics-ops yet - T-005 confirms the hosting target and replaces this step."
