name: repo

# The five app workflows are path-filtered to an app and the packages it depends on, which leaves
# real gaps: a shared package no app imports yet (ui-kit, api-client), the repo-level suite in
# scripts/test, and formatting. Those are exactly the places where "no workflow ran" looks the same
# as "everything passed", so this one runs on everything and filters nothing.
on:
  push:
    # `staging` as well as `main`: every ticket now branches off staging and merges back into it
    # (MASTER_BUILD_PROMPT step 7), so that is where work actually lands. Without this the merge
    # commit itself is never built — a pull request is checked, but the result of merging it is
    # not, and a staging deploy would go out on a commit no workflow ever saw.
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-${{ github.ref }}
  # Superseding a feature branch's run is fine. Neither release branch may be cancelled:
  # `staging` deploys now too, so cutting its run short kills a deploy half-way exactly as
  # cancelling main's would.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  # Four jobs side by side instead of one long one (2026-11-20): the quick repository checks, the
  # browser-gated suites, lint + typecheck + build, and the workspace tests split four ways. A cold
  # run spent ~9 minutes in a single "every workspace package" step; each of these is a fraction.
  checks:
    runs-on: ubuntu-latest
    steps:
      # Full history. `scripts/test/migration-safety.test.ts` resolves a commit from before the
      # drizzle folder existed, to prove the tool explains itself rather than throwing when the
      # baseline predates every migration. actions/checkout defaults to a depth of 1, so that
      # commit is simply absent and the test fails on `unknown revision` — which it did on every
      # run of this workflow, for a reason that had nothing to do with the code being tested.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: repo
      - name: Fee schedule version
        # A fee value may not change without a `version` bump (design §6.5). `config/**` is outside
        # every app workflow's derived path filter, so this also runs in the unfiltered repo
        # workflow - otherwise a commit touching only config/fees.yaml would be checked by nothing.
        run: |
          # On a push, origin/main IS the commit just pushed, so comparing against it would compare
          # the file with itself and pass every time. The base is what main pointed at before.
          if [ "${{ github.event_name }}" = "push" ]; then
            base='${{ github.event.before }}'
            git fetch --no-tags --depth=2 origin "$base" || true
          else
            git fetch --no-tags --depth=1 origin main
            base=FETCH_HEAD
          fi
          node tools/fee-version-check/cli.mjs "$base"
      - name: Formatting
        run: pnpm format:check
      - name: Repository tests
        # Not the app suites — those belong to the app workflows, which can skip when nothing they
        # own changed. This is the suite that checks the repository itself: env templates, commit
        # rules, secret hygiene, the workflows in this directory and the screen index.
        run: pnpm test:repo

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: repo-browser
      - name: Browser-gated suites
        # The visual-check harness and the Playwright smoke test are gated on KOMTRU_BROWSER_TESTS=1
        # so a fresh checkout without browsers stays green. Nothing else sets it, so without this
        # step the only thing proving the harness still takes a correct screenshot never runs.
        run: |
          pnpm browsers:install
          pnpm test:browser
          KOMTRU_BROWSER_TESTS=1 pnpm exec turbo run test --filter=@komtru/visual-check --force

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: repo-build
      - name: Lint, typecheck and build every workspace package
        # Unfiltered, so a package no app imports yet is still linted, typechecked and built.
        #
        # The Next apps are built here too, and `next build` evaluates their route modules to
        # collect page data — so an app whose config throws on a missing NEXT_PUBLIC_* fails here
        # exactly as it would in its own workflow.
        env:
          NEXT_PUBLIC_KOMTRU_APP_URL: ${{ vars.WEB_APP_URL || 'https://app.komtru.com' }}
          NEXT_PUBLIC_KOMTRU_API_URL: ${{ vars.KOMTRU_API_URL || 'https://api.komtru.com/v1' }}
          NEXT_PUBLIC_KOMTRU_PASSPORT_URL: ${{ vars.KOMTRU_PASSPORT_URL || 'https://passport.komtru.com' }}
          NEXT_PUBLIC_KOMTRU_PARK_URL: ${{ vars.KOMTRU_PARK_URL || 'https://park.komtru.com' }}
          NEXT_PUBLIC_KOMTRU_SITE_URL: ${{ vars.KOMTRU_SITE_URL || 'https://komtru.com' }}
          KOMTRU_SESSION_SECRET: ${{ secrets.KOMTRU_SESSION_SECRET || 'ci-build-only-placeholder-secret' }}
        # `--concurrency=2` to match the runner's two cores.
        #
        # Turbo defaults to 10 parallel tasks. On a two-core runner that means ten jobs timeslicing
        # two cores, and the result is not slowness but WRONG ANSWERS: a Vitest hook or test that
        # takes a second alone blows its timeout, and the suite reports a broken socket module or a
        # broken carve. Four separate "failures" chased today were all this, and each one hid the
        # next because the run stops reporting after the first.
        #
        # Capping it does not make the step slower in any way that matters — the work was always
        # serialised by the two cores. It just stops the scheduler pretending otherwise.
        run: pnpm exec turbo run lint typecheck build --concurrency=2

  test:
    runs-on: ubuntu-latest
    # Every workspace package's tests, unfiltered, in four shards. `--shard` reaches each package's
    # `vitest run`, so every package contributes a quarter of its files to each shard, and turbo
    # folds the arguments after `--` into the task hash, so one shard is never handed another's
    # cached result. `--passWithNoTests` because a package with fewer files than shards has an
    # empty one. `fail-fast: false` so a red shard does not cancel the others and hide what they
    # were about to report.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # This job runs the backend suite unfiltered, and parts
    # of that suite build the socket module — which opens the Socket.IO adapter's Redis pair even
    # in a unit test, because the registry is a pure function of its dependencies and builds every
    # module. Without a Redis here those are refused connections, which is not a fair test of
    # anything. Same image and published port as backend-api.yml and docker-compose.yml, because
    # the tests hard-code redis://localhost:56379. Throwaway container; nothing here is a secret.
    #
    # Postgres is deliberately absent: the integration suites are gated on KOMTRU_INFRA_TESTS,
    # which this job does not set, so they skip and nothing in the unfiltered run dials Postgres.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - '56379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: repo-test
      - name: Every workspace package's tests (shard ${{ matrix.shard }}/4)
        # `--concurrency=2` to match the runner's two cores: more tasks than cores make Vitest
        # timeouts fire on a loaded runner, which reports failures that are not real.
        run: pnpm exec turbo run test --concurrency=2 -- --shard=${{ matrix.shard }}/4 --passWithNoTests
