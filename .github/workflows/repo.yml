name: repo

# The five app workflows are path-filtered to an app and the packages it depends on, which leaves
# real gaps: a shared package no app imports yet (ui-kit, api-client), the repo-level suite in
# scripts/test, and formatting. Those are exactly the places where "no workflow ran" looks the same
# as "everything passed", so this one runs on everything and filters nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-${{ github.ref }}
  # Superseding a feature branch's run is fine; cancelling main's would kill a deploy half-way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: repo
      - name: Fee schedule version
        # A fee value may not change without a `version` bump (design §6.5). `config/**` is outside
        # every app workflow's derived path filter, so this also runs in the unfiltered repo
        # workflow - otherwise a commit touching only config/fees.yaml would be checked by nothing.
        run: |
          # On a push, origin/main IS the commit just pushed, so comparing against it would compare
          # the file with itself and pass every time. The base is what main pointed at before.
          if [ "${{ github.event_name }}" = "push" ]; then
            base='${{ github.event.before }}'
            git fetch --no-tags --depth=2 origin "$base" || true
          else
            git fetch --no-tags --depth=1 origin main
            base=FETCH_HEAD
          fi
          node tools/fee-version-check/cli.mjs "$base"
      - name: Formatting
        run: pnpm format:check
      - name: Repository tests
        # Not the app suites — those belong to the app workflows, which can skip when nothing they
        # own changed. This is the suite that checks the repository itself: env templates, commit
        # rules, secret hygiene, the workflows in this directory and the screen index.
        run: pnpm test:repo
      - name: Browser-gated suites
        # The visual-check harness and the Playwright smoke test are gated on KOMTRU_BROWSER_TESTS=1
        # so a fresh checkout without browsers stays green. Nothing else sets it, so without this
        # step the only thing proving the harness still takes a correct screenshot never runs.
        run: |
          pnpm browsers:install
          pnpm test:browser
          KOMTRU_BROWSER_TESTS=1 pnpm exec turbo run test --filter=@komtru/visual-check --force

      - name: Every workspace package
        # Unfiltered, so a package no app imports yet is still linted, typechecked, tested and
        # built. Turbo's cache makes this cheap once the app workflows have run.
        run: pnpm exec turbo run lint typecheck test build
