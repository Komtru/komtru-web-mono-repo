# CI for apps/web-site.
#
# Filtered to this app's OWN directory, deliberately — not to the packages it imports.
#
# A change to `api-client` or `ui-kit` used to start this run, and every other app's run with it:
# one edit to a shared package meant five full pipelines. Two things make the narrow filter safe.
# `repo.yml` filters nothing and runs `turbo run lint typecheck test build` over every workspace
# package on every push, so a shared-package change that breaks this app is still caught there.
# And this workflow does not deploy — Vercel's own git integration watches the branch, so what
# ships is decided by the push, not by whether this filter matched.
#
# `backend-api` is the exception and keeps its dependency paths: it is the one workflow that
# really deploys, so it has to rebuild when the code it bundles changes.
name: web-site

on:
  push:
    # `staging` as well as `main`: every ticket now branches off staging and merges back into it
    # (MASTER_BUILD_PROMPT step 7), so that is where work actually lands. Without this the merge
    # commit itself is never built — a pull request is checked, but the result of merging it is
    # not, and a staging deploy would go out on a commit no workflow ever saw.
    branches: [main, staging]
    paths:
      - 'apps/web-site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/web-site.yml'
      - '.github/actions/setup/**'
  pull_request:
    paths:
      - 'apps/web-site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/web-site.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-site-${{ github.ref }}
  # Superseding a feature branch's run is fine. Neither release branch may be cancelled:
  # `staging` deploys now too, so cutting its run short kills a deploy half-way exactly as
  # cancelling main's would.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: web-site
      - run: pnpm exec turbo run lint --filter=@komtru/web-site

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: web-site
      - run: pnpm exec turbo run typecheck --filter=@komtru/web-site

  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: web-site
      - run: pnpm exec turbo run test --filter=@komtru/web-site

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: web-site
      - run: pnpm exec turbo run build --filter=@komtru/web-site

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Vercel builds and deploys this app from its own git integration on every push to `main`, so
      # there is nothing for CI to push. This step is the marker the workflow contract expects, and
      # the place a deploy would go if the site ever leaves Vercel - as T-005 covers for the others.
      - run: echo "web-site deploys from Vercel's git integration; T-005 owns any move off it."
