# CI for apps/operations-app. Path-filtered to the app, the packages it depends on and the few root files that
# change every build, so a change to another app never starts this run. GitHub Actions does not
# support YAML anchors, hence the duplicated `paths:` list.
name: operations-app

on:
  push:
    branches: [main]
    paths:
      - 'apps/operations-app/**'
      - 'packages/api-client/**'
      - 'packages/app-kit/**'
      - 'packages/config/**'
      - 'packages/shared-types/**'
      - 'packages/ui-kit/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/operations-app.yml'
      - '.github/actions/setup/**'
  pull_request:
    paths:
      - 'apps/operations-app/**'
      - 'packages/api-client/**'
      - 'packages/app-kit/**'
      - 'packages/config/**'
      - 'packages/shared-types/**'
      - 'packages/ui-kit/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/operations-app.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-app-${{ github.ref }}
  # Superseding a feature branch's run is fine; cancelling main's would kill a deploy half-way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: operations-app
      - run: pnpm exec turbo run lint --filter=@komtru/operations-app

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: operations-app
      - run: pnpm exec turbo run typecheck --filter=@komtru/operations-app

  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: operations-app
      - run: pnpm exec turbo run test --filter=@komtru/operations-app

  build:
    needs: [test]
    runs-on: ubuntu-latest
    # Same reason as web-app-ui's build job: `next build` evaluates the route modules to collect
    # page data, and this app's config throws when NEXT_PUBLIC_KOMTRU_APP_URL or
    # NEXT_PUBLIC_KOMTRU_API_URL is missing - so prerendering every console page fails before a
    # line of it is written. The fallbacks keep the job honest before the repository variables
    # exist; nothing is deployed from here.
    env:
      NEXT_PUBLIC_KOMTRU_APP_URL: ${{ vars.WEB_APP_URL || 'https://app.komtru.com' }}
      NEXT_PUBLIC_KOMTRU_API_URL: ${{ vars.KOMTRU_API_URL || 'https://api.komtru.com/v1' }}
      KOMTRU_SESSION_SECRET: ${{ secrets.KOMTRU_SESSION_SECRET || 'ci-build-only-placeholder-secret' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: operations-app
      - run: pnpm exec turbo run build --filter=@komtru/operations-app

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Placeholder: the hosting target is design §12 Q1, confirmed and wired up in T-005. Real
      # credentials will arrive as ${{ secrets.* }}; never as literals in this file.
      - run: echo "operations-app deploys from Vercel's git integration (staging-ops.komtru.com from staging); T-005 owns any move off it."
