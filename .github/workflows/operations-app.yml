# CI for apps/operations-app.
#
# Filtered to this app's OWN directory, deliberately — not to the packages it imports.
#
# A change to `api-client` or `ui-kit` used to start this run, and every other app's run with it:
# one edit to a shared package meant five full pipelines. Two things make the narrow filter safe.
# `repo.yml` filters nothing and runs `turbo run lint typecheck test build` over every workspace
# package on every push, so a shared-package change that breaks this app is still caught there.
# And this workflow does not deploy — Vercel's own git integration watches the branch, so what
# ships is decided by the push, not by whether this filter matched.
#
# `backend-api` is the exception and keeps its dependency paths: it is the one workflow that
# really deploys, so it has to rebuild when the code it bundles changes.
name: operations-app

on:
  push:
    # `staging` as well as `main`: every ticket now branches off staging and merges back into it
    # (MASTER_BUILD_PROMPT step 7), so that is where work actually lands. Without this the merge
    # commit itself is never built — a pull request is checked, but the result of merging it is
    # not, and a staging deploy would go out on a commit no workflow ever saw.
    branches: [main, staging]
    paths:
      - 'apps/operations-app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/operations-app.yml'
      - '.github/actions/setup/**'
  pull_request:
    paths:
      - 'apps/operations-app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/operations-app.yml'
      - '.github/actions/setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-app-${{ github.ref }}
  # Superseding a feature branch's run is fine. Neither release branch may be cancelled:
  # `staging` deploys now too, so cutting its run short kills a deploy half-way exactly as
  # cancelling main's would.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: operations-app
      - run: pnpm exec turbo run lint --filter=@komtru/operations-app

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: operations-app
      - run: pnpm exec turbo run typecheck --filter=@komtru/operations-app

  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: operations-app
      - run: pnpm exec turbo run test --filter=@komtru/operations-app

  build:
    needs: [test]
    runs-on: ubuntu-latest
    # Same reason as web-app-ui's build job: `next build` evaluates the route modules to collect
    # page data, and this app's config throws when NEXT_PUBLIC_KOMTRU_APP_URL or
    # NEXT_PUBLIC_KOMTRU_API_URL is missing - so prerendering every console page fails before a
    # line of it is written. The fallbacks keep the job honest before the repository variables
    # exist; nothing is deployed from here.
    env:
      NEXT_PUBLIC_KOMTRU_APP_URL: ${{ vars.WEB_APP_URL || 'https://app.komtru.com' }}
      NEXT_PUBLIC_KOMTRU_API_URL: ${{ vars.KOMTRU_API_URL || 'https://api.komtru.com/v1' }}
      KOMTRU_SESSION_SECRET: ${{ secrets.KOMTRU_SESSION_SECRET || 'ci-build-only-placeholder-secret' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: operations-app
      - run: pnpm exec turbo run build --filter=@komtru/operations-app

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Placeholder: the hosting target is design §12 Q1, confirmed and wired up in T-005. Real
      # credentials will arrive as ${{ secrets.* }}; never as literals in this file.
      - run: echo "operations-app deploys from Vercel's git integration (staging-ops.komtru.com from staging); T-005 owns any move off it."
