name: Setup Komtru workspace
description: Installs pnpm and Node from the root package.json, installs the workspace and restores the pnpm store and the Turbo cache.

inputs:
  cache-key:
    description: Extra segment for the Turbo cache key, so jobs that build different things do not fight over one entry.
    required: false
    default: shared

runs:
  using: composite
  steps:
    # No `version:` — the action reads `packageManager` from the root package.json, which is the one
    # place pnpm is pinned.
    - uses: pnpm/action-setup@v6

    # Must come after pnpm: `cache: pnpm` shells out to `pnpm store path`. `node-version-file:
    # package.json` resolves `engines.node`, so Node is pinned in the manifest and nowhere else.
    - uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: pnpm

    - name: Install workspace
      shell: bash
      run: pnpm install --frozen-lockfile

    # Turbo's local cache. The primary key never hits (it carries the commit sha), so every run
    # writes a fresh entry and restores the newest matching one — an append-only cache.
    - name: Restore Turbo cache
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-${{ inputs.cache-key }}-
